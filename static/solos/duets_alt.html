<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Duets</title>
    <style>
        #playlist,
        player {
            background: #666;
            width: 400px;
            padding: 20px;
        }

        .active a {
            color: #5DB0E6;
            text-decoration: none;
        }

        li a {
            color: #eeeedd;
            background: #333;
            padding: 5px;
            display: block;
        }

        li a:hover {
            text-decoration: none;
        }

        #container,
        #player {
            max-width: 100%;
        }
    </style>
    <script>
        $(document).ready(function () {
            var audio;
            var current;
            var playlist;
            var tracks;

            init();
            function init() {
                current = 0;
                audio = $('player');
                playlist = $('#playlist');
                tracks = playlist.find('li a');
                audio[0].play();

                playlist.find('a').click('click', 'a', function(e) {
                    e.preventDefault();
                    link = $(this);
                    current = link.parent().index();
                    run(link, audio[0]);
                });
                audio[0].addEventListener('ended', function(e) {
                    current++;
                    link = playlist.find('a')[current];
                    run($(link), audio[0]);
                });
            }
            function run(link, player) {
                //player.src = link.attr('href');
                player.attr('src', link.attr('href'));
                par = link.parent();
                par.addClass('active').siblings().removeClass('active');
                player.load();
                player.play();
            }
        })
    </script>
</head>

<body onload="init()">
    <h2>Duets by Ken and Ginger</h2>
    <h3>Recorded 17 Nov 2018</h3>
    <div id="container">
        <audio id="player" preload="auto" tabindex="0" controls="">
            <source type="audio/mp3" 
                src="http://www.kousenit.com/music/suddenly_seymour.mp3">
                Sorry, your browser does not support HTML5 audio.
            </source>
        </audio>
    </div>
    <ul id="playlist">
        <li>
            <a href="http://www.kousenit.com/music/suddenly_seymour.mp3">Suddenly Seymour</a>
        </li>
        <li>
            <a href="http://www.kousenit.com/music/come_what_may.mp3">Come What May</a>
        </li>
        <li>
            <a href="http://www.kousenit.com/music/the_prayer.mp3">The Prayer</a>
        </li>
        <li class="active">
            <a href="http://www.kousenit.com/music/always.mp3">Always</a>
        </li>
        <li>
            <a href="http://www.kousenit.com/music/all_i_ask_of_you.mp3">All I Ask Of You</a>
        </li>
    </ul>
</body>
