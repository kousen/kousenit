# about
about:
  enable: true
  title: "Ken Kousen, President"
  content: '<p class="lead">
    Welcome to Kousen IT, Inc! Kousen IT is run by Ken Kousen, a Java Champion and the author of the books 
    <em>Making Java Groovy</em>, <em>Modern Java Recipes</em>, <em>Gradle Recipes for Android</em>, <em>Kotlin
    Cookbook</em>, and <em>Help Your Boss Help You</em>. My latest book, <em>Mockito
    Made Clear</em>, is in beta at Pragmatic Programmers.
    </p>
    <p class="lead">
    I have been a regular speaker on the 
    <a target="_blank" href="https://nofluffjuststuff.com">No Fluff, 
    Just Stuff</a> conference tour for the past decade, and have given talks and keynotes
    at conferences all over the world. I have won several awards for presentations, 
    including JavaOne Rock Star and Devnexus Rock Star. 
    </p>
    <p class="lead">
    I am also a Grails Rock Star and the co-host of the 
    <a target="_blank" href="https://nofluffjuststuff.com/groovypodcast">Groovy Podcast</a>.
    </p>
    <p>
    <a rel="me" href="https://mastodon.social/@kenkousen">My profile on Mastodon</a>
    </p>'
  button:
    icon: "icon-smile-fill"
    btnText: "LinkedIn"
    URL: "https://www.linkedin.com/in/kenkousen/"
  image:
    x: "img/who-am-i/kousen_sep2019_medium.png"
    _2x: "img/who-am-i/kousen_sep2019_medium.png"

