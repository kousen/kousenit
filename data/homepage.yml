# books
books:
  enable: true
  title: "Books"

  books:
    - title: "Mockito Made Clear"
      publisher: "Pragmatic Programmers"
      date: "June, 2022 (beta)"
      description: "Mockito is the most popular framework in the Java world for automating unit testing with dependencies. Learn the Mockito API and how and when to use stubs, mocks, and spies. On a deeper level, discover why the framework does what it does and how it can simplify unit testing in Java. Using Mockito, you’ll be able to isolate the code you want to test from the behavior or state of external dependencies without coding details of the dependency. You’ll gain insights into the Mockito API, save time when unit testing, and have confidence in your Java programs."
      button:
        icon: "icon-arrow-right"
        btnText: "Pragmatic Programmers"
        URL: "https://pragprog.com/titles/mockito/mockito-made-clear/"
      image:
        x: "img/books/mmc_cover_pragprog.jpeg"
        _2x: "img/books/mmc_cover_pragprog.jpeg"
      is_even: false

    - title: "Help Your Boss Help You"
      date: "August, 2021"
      description: "Develop more productive habits in dealing with your manager. As a professional in the business world, you care about doing your job the right way. The quality of your work matters to you, both as a professional and as a person. The company you work for cares about making money and your boss is evaluated on that basis. Sometimes those goals overlap, but the different priorities mean conflict is inevitable. Take concrete steps to build a relationship with your manager that helps both sides succeed."
      button:
        icon: "icon-arrow-right"
        btnText: "Pragmatic Programmers"
        URL: "https://www.amazon.com/Help-Your-Boss-You-Opportunities/dp/1680508229/"
      image:
        x: "img/books/hybhy_cover_amazon.jpeg"
        _2x: "img/books/hybhy_cover_amazon.jpeg"
      is_even: true


    - title: "Kotlin Cookbook"
      date: "December, 2019"
      description: "Use Kotlin to build Android apps, web applications, and more―while you learn the nuances of this popular language. With this unique cookbook, developers will learn how to apply this Java-based language to their own projects. Both experienced programmers and those new to Kotlin will benefit from the practical recipes in this book."
      button:
        icon: "icon-arrow-right"
        btnText: "Amazon"
        URL: "https://www.amazon.com/Kotlin-Cookbook-Problem-Focused-Ken-Kousen/dp/1492046671/"
      image:
        x: "img/books/kcb_cover_amazon.jpeg"
        _2x: "img/books/kcb_cover_amazon.jpeg"
      is_even: false

    - title: "Modern Java Recipes"
      publisher: "O'Reilly Media"
      date: "September, 2017"
      description: "The introduction of functional programming concepts in Java SE 8 was a drastic change for this venerable object-oriented language. Lambda expressions, method references, and streams fundamentally changed the idioms of the language, and many developers have been trying to catch up ever since. This cookbook will help. With more than 70 detailed recipes, author Ken Kousen shows you how to use the newest features of Java to solve a wide range of problems. For developers comfortable with previous Java versions, this guide covers nearly all of Java SE 8, and includes a chapter focused on changes coming in Java 9. Need to understand how functional idioms will change the way you write code? This cookbook—chock full of use cases—is for you."
      button:
        icon: "icon-arrow-right"
        btnText: "Amazon"
        URL: "https://www.amazon.com/Modern-Java-Recipes-Solutions-Difficult/dp/149197317X/"
      image:
        x: "img/books/mjr_cover_amazon.jpeg"
        _2x: "img/books/mjr_cover_amazon.jpeg"
      is_even: true

    - title: "Gradle Recipes for Android"
      date: "July, 2016"
      description: "Android adopted Gradle as the preferred build automation system a few years ago, but many Android developers are still unfamiliar with this open source tool. This hands-on guide provides a collection of Gradle recipes to help you quickly and easily accomplish the most common build tasks for your Android apps. You’ll learn how to customize project layouts, add dependencies, and generate many different versions of your app."
      button:
        icon: "icon-arrow-right"
        btnText: "Amazon"
        URL: "https://www.amazon.com/Gradle-Recipes-Android-Master-System-ebook/dp/B01GQTM84E"
      image:
        x: "img/books/gra_cover_amazon.jpeg"
        _2x: "img/books/gra_cover_amazon.jpeg"
      is_even: false

    - title: "Making Java Groovy"
      date: "September, 2013"
      description: "A practical handbook for developers who want to blend Groovy into their day-to-day work with Java. It starts by introducing the key differences between Java and Groovy—and how you can use them to your advantage. Then, it guides you step-by-step through realistic development challenges, from web applications to web services to desktop applications, and shows how Groovy makes them easier to put into production."
      button:
        icon: "icon-arrow-right"
        btnText: "Manning"
        URL: "https://www.manning.com/books/making-java-groovy"
      image:
        x: "img/books/mjg_cover_amazon.jpeg"
        _2x: "img/books/mjg_cover_amazon.jpeg"
      is_even: true

